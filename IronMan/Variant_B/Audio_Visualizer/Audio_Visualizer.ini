; =============================================================
; IRON MAN SUITE — AUDIO VISUALIZER HUD
; Real-time arc frequency waveform / audio equalizer
; =============================================================

[Rainmeter]
Update=40
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
Group=IronMan
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
@includeThemeOverride=#@#Variables_1B_Stealth.inc
Scale=0.75
BarW=8
BarGap=4
VisH=45

; =============================================================
; MEASURES — AUDIO SPECTRUM (AudioLevel Plugin)
; =============================================================

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=40
FFTDecay=120
Bands=16
FreqMin=40
FreqMax=16000
Sensitivity=35

[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0

