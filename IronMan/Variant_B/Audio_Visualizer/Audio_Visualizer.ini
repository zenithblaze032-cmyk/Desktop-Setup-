; =============================================================
; METERS
; =============================================================

[styleRoundline]
X=0
Y=0
W=(200*#Scale#)
H=(200*#Scale#)
LineStart=(50*#Scale#)
Solid=1
ControlAngle=0
ControlLength=0
AntiAlias=1
RotationAngle=0.294524
DynamicVariables=1

[MeterRoundline0]
Meter=Roundline
MeterStyle=styleRoundline
StartAngle=4.712389
LineColor=#ColorAccent#
LineLength=( (50*#Scale#) + ([MeasureBand0]*80*#Scale#) )

