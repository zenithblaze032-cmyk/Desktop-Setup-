; =============================================================
; IRON MAN SUITE — NETWORK TELEMETRY HUD
; Holographic upload & download speed rates and data flux
; =============================================================

[Rainmeter]
Update=1500
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
Group=IronMan
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
@includeThemeOverride=#@#Variables_1B_Stealth.inc
Scale=1.3
BarW=230
BarH=3

; =============================================================
; MEASURES
; =============================================================

[MeasureNetIn]
Measure=NetIn
Interface=0

[MeasureNetOut]
Measure=NetOut
Interface=0

; =============================================================
; METERS
; =============================================================

; Frame
[MeterNetFrame]
Meter=Shape
Shape=Rectangle 0,0,(280*#Scale#),(155*#Scale#),4 | Fill Color #ColorPanelBg# | Stroke Color #ColorPanelBorder# | StrokeWidth (1*#Scale#)
Shape2=Path NetCorner | Stroke Color #ColorAccent# | StrokeWidth (2*#Scale#) | Fill Color 0,0,0,0
NetCorner=LineTo (25*#Scale#),0 | MoveTo 0,0 | LineTo 0,(25*#Scale#)
Shape3=Rectangle (15*#Scale#),(32*#Scale#),(250*#Scale#),(1*#Scale#) | Fill Color #ColorGrid# | StrokeWidth 0
X=0
Y=0
DynamicVariables=1

; Header
[MeterNetHeader]
Meter=String
Text="UPLINK // SATELLITE COMMS"
FontFace=Porter
FontColor=#ColorPrimary#
FontSize=(7.5*#Scale#)
X=(16*#Scale#)
Y=(12*#Scale#)
InlineSetting=CharacterSpacing | 1.5 | 1.5
AntiAlias=1
DynamicVariables=1

[MeterNetSub]
Meter=String
Text="BANDWIDTH FLUX TELEMETRY"
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(6.5*#Scale#)
X=(16*#Scale#)
Y=(22*#Scale#)
AntiAlias=1
DynamicVariables=1

; ===================== DOWNLOAD =====================
[MeterDownLabel]
Meter=String
Text="▼ DOWNLINK RECEIVE"
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(7*#Scale#)
X=(16*#Scale#)
Y=(42*#Scale#)
AntiAlias=1
DynamicVariables=1

[MeterDownValue]
Meter=String
MeasureName=MeasureNetIn
FontFace=Gobold Bold
FontColor=#ColorPrimary#
FontSize=(16*#Scale#)
X=(264*#Scale#)
Y=(38*#Scale#)
StringAlign=Right
AutoScale=1
NumOfDecimals=1
Text="%1B/s"
InlineSetting=Shadow | 0 | 0 | (8*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

[MeterDownBarBg]
Meter=Shape
Shape=Rectangle (16*#Scale#),(64*#Scale#),(#BarW#*#Scale#),(#BarH#*#Scale#),1 | Fill Color #ColorGrid# | StrokeWidth 0
DynamicVariables=1

[MeterDownBar]
Meter=Bar
MeasureName=MeasureNetIn
BarColor=#ColorAccent#
BarOrientation=Horizontal
X=(16*#Scale#)
Y=(64*#Scale#)
W=(#BarW#*#Scale#)
H=(#BarH#*#Scale#)
DynamicVariables=1

; ===================== UPLOAD =====================
[MeterUpLabel]
Meter=String
Text="▲ UPLINK TRANSMIT"
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(7*#Scale#)
X=(16*#Scale#)
Y=(80*#Scale#)
AntiAlias=1
DynamicVariables=1

[MeterUpValue]
Meter=String
MeasureName=MeasureNetOut
FontFace=Gobold Bold
FontColor=#ColorPrimary#
FontSize=(16*#Scale#)
X=(264*#Scale#)
Y=(76*#Scale#)
StringAlign=Right
AutoScale=1
NumOfDecimals=1
Text="%1B/s"
InlineSetting=Shadow | 0 | 0 | (8*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

[MeterUpBarBg]
Meter=Shape
Shape=Rectangle (16*#Scale#),(102*#Scale#),(#BarW#*#Scale#),(#BarH#*#Scale#),1 | Fill Color #ColorGrid# | StrokeWidth 0
DynamicVariables=1

[MeterUpBar]
Meter=Bar
MeasureName=MeasureNetOut
BarColor=#ColorAccent#
BarOrientation=Horizontal
X=(16*#Scale#)
Y=(102*#Scale#)
W=(#BarW#*#Scale#)
H=(#BarH#*#Scale#)
DynamicVariables=1

; Footer
[MeterNetFooter]
Meter=String
Text="ENCRYPTED QUANTUM LINK: CONNECTED"
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(6*#Scale#)
X=(16*#Scale#)
Y=(124*#Scale#)
InlineSetting=CharacterSpacing | 1 | 1
AntiAlias=1
DynamicVariables=1
