; =============================================================
; IRON MAN SUITE — ARC REACTOR CLOCK HUD
; Rotating arc core rings, digital Stark clock, seconds ring
; =============================================================

[Rainmeter]
Update=50
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
Group=IronMan
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
@includeThemeOverride=#@#Variables_1B_Stealth.inc
Scale=0.8

; =============================================================
; MEASURES
; =============================================================

[MeasureTime]
Measure=Time
Format=#Format#

[MeasureSeconds]
Measure=Time
Format=%S

[MeasureAmPm]
Measure=Time
Format=%p

; Pulsing / Rotating Arc Reactor Core Angle
[MeasureRotateOuter]
Measure=Calc
Formula=(MeasureRotateOuter + 1) % 360

[MeasureRotateInner]
Measure=Calc
Formula=(MeasureRotateInner - 2) % 360

; =============================================================
; METERS — ARC REACTOR GRAPHICS & DIGITAL DISPLAY
; =============================================================

; Outer HUD Bracket
[MeterOuterBrackets]
Meter=Shape
Shape=Ellipse (120*#Scale#),(120*#Scale#),(110*#Scale#),(110*#Scale#) | Stroke Color #ColorPanelBorder# | StrokeWidth (1*#Scale#) | StrokeDashes 8, 14 | Fill Color 0,0,0,0
Shape2=Ellipse (120*#Scale#),(120*#Scale#),(98*#Scale#),(98*#Scale#) | Stroke Color #ColorGrid# | StrokeWidth (1.5*#Scale#) | Fill Color 0,0,0,0
Shape3=Rectangle (118*#Scale#),(5*#Scale#),(4*#Scale#),(12*#Scale#) | Fill Color #ColorAccent# | StrokeWidth 0
Shape4=Rectangle (118*#Scale#),(223*#Scale#),(4*#Scale#),(12*#Scale#) | Fill Color #ColorAccent# | StrokeWidth 0
Shape5=Rectangle (5*#Scale#),(118*#Scale#),(12*#Scale#),(4*#Scale#) | Fill Color #ColorAccent# | StrokeWidth 0
Shape6=Rectangle (223*#Scale#),(118*#Scale#),(12*#Scale#),(4*#Scale#) | Fill Color #ColorAccent# | StrokeWidth 0
X=0
Y=0
DynamicVariables=1

; Outer Arc Reactor Segment Ring (Seconds Progress)
[MeterSecondsArc]
Meter=Roundline
MeasureName=MeasureSeconds
X=0
Y=0
W=(240*#Scale#)
H=(240*#Scale#)
StartAngle=(Rad(-90))
RotationAngle=(Rad(360))
LineLength=(94*#Scale#)
LineStart=(88*#Scale#)
LineColor=#ColorPrimary#
Solid=1
AntiAlias=1
DynamicVariables=1

; Inner Tech Ring 1 (Dotted)
[MeterDottedRing]
Meter=Roundline
MeasureName=MeasureRotateOuter
X=0
Y=0
W=(240*#Scale#)
H=(240*#Scale#)
StartAngle=(Rad(0))
RotationAngle=(Rad(360))
LineLength=(84*#Scale#)
LineStart=(82*#Scale#)
LineColor=#ColorAccent#
Solid=1
AntiAlias=1
DynamicVariables=1

; Inner Tech Ring 2 (Rotating Segments)
[MeterRotatingArcs]
Meter=Roundline
MeasureName=MeasureRotateInner
X=0
Y=0
W=(240*#Scale#)
H=(240*#Scale#)
StartAngle=(Rad(0))
RotationAngle=(Rad(120))
LineLength=(76*#Scale#)
LineStart=(73*#Scale#)
LineColor=#ColorSecondary#
Solid=1
AntiAlias=1
DynamicVariables=1

; Core Circular Plate
[MeterCorePlate]
Meter=Shape
Shape=Ellipse (120*#Scale#),(120*#Scale#),(68*#Scale#),(68*#Scale#) | Fill Color #ColorPanelBg# | Stroke Color #ColorAccent# | StrokeWidth (1.5*#Scale#)
Shape2=Ellipse (120*#Scale#),(120*#Scale#),(64*#Scale#),(64*#Scale#) | Fill Color 0,0,0,0 | Stroke Color #ColorWireframe# | StrokeWidth (0.8*#Scale#)
X=0
Y=0
DynamicVariables=1

; Core Watermark / Reactor Icon
[MeterReactorMark]
Meter=String
Text="MARK // ARC-85"
StringAlign=Center
FontFace=Space Mono
FontColor=#ColorMuted#
FontSize=(6.5*#Scale#)
X=(120*#Scale#)
Y=(80*#Scale#)
InlineSetting=CharacterSpacing | 1 | 1
AntiAlias=1
DynamicVariables=1

; Digital Time Main Display
[MeterClockTime]
Meter=String
MeasureName=MeasureTime
StringAlign=Center
FontFace=Gobold Bold
FontColor=#ColorPrimary#
FontSize=(32*#Scale#)
X=(120*#Scale#)
Y=(92*#Scale#)
InlineSetting=Shadow | 0 | 0 | (12*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

; AM/PM & Core Status
[MeterClockSub]
Meter=String
MeasureName=MeasureAmPm
StringAlign=Center
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(7.5*#Scale#)
X=(120*#Scale#)
Y=(136*#Scale#)
Text="ONLINE • %1"
InlineSetting=CharacterSpacing | 1.5 | 1.5
AntiAlias=1
DynamicVariables=1
