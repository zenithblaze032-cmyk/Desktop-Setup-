; =============================================================
; IRON MAN SUITE — DATE & DAY HUD
; Tech brackets, Stark typography, month/day/year telemetry
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
Group=IronMan
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
@includeThemeOverride=#@#Variables_3A_HeavyCrimson.inc
Scale=1.15

; =============================================================
; MEASURES
; =============================================================

[MeasureDay]
Measure=Time
Format=%A

[MeasureDayUpper]
Measure=Time
Format=%A
StringCase=Upper

[MeasureDate]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%B
StringCase=Upper

[MeasureYear]
Measure=Time
Format=%Y

[MeasureWeekNumber]
Measure=Time
Format=%W

; =============================================================
; METERS
; =============================================================

; Outer HUD Tech Bracket Shape
[MeterDateHUD]
Meter=Shape
Shape=Rectangle 0,0,(310*#Scale#),(110*#Scale#),4 | Fill Color #ColorPanelBg# | Stroke Color #ColorPanelBorder# | StrokeWidth (1*#Scale#)
Shape2=Path BracketCorner | Stroke Color #ColorAccent# | StrokeWidth (2*#Scale#) | Fill Color 0,0,0,0
BracketCorner=LineTo (25*#Scale#),0 | MoveTo 0,0 | LineTo 0,(25*#Scale#)
Shape3=Path BracketBottom | Stroke Color #ColorAccent# | StrokeWidth (2*#Scale#) | Fill Color 0,0,0,0
BracketBottom=MoveTo (310*#Scale#),(85*#Scale#) | LineTo (310*#Scale#),(110*#Scale#) | LineTo (285*#Scale#),(110*#Scale#)
Shape4=Rectangle (105*#Scale#),(18*#Scale#),(1.5*#Scale#),(74*#Scale#) | Fill Color #ColorGrid# | StrokeWidth 0
X=0
Y=0
DynamicVariables=1

; Day of Week (HUD Monospace Header)
[MeterDayHeader]
Meter=String
MeasureName=MeasureDayUpper
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(7*#Scale#)
X=(16*#Scale#)
Y=(14*#Scale#)
Text="SYS.DATE // %1"
InlineSetting=CharacterSpacing | 1.5 | 1.5
AntiAlias=1
DynamicVariables=1

; Large Day Number (Date)
[MeterLargeDate]
Meter=String
MeasureName=MeasureDate
FontFace=Gobold Bold
FontColor=#ColorPrimary#
FontSize=(52*#Scale#)
X=(12*#Scale#)
Y=(24*#Scale#)
InlineSetting=Shadow | 0 | 0 | (10*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

; Month Full Name
[MeterMonth]
Meter=String
MeasureName=MeasureMonth
FontFace=Porter
FontColor=#ColorHighlight#
FontSize=(16*#Scale#)
X=(120*#Scale#)
Y=(20*#Scale#)
InlineSetting=CharacterSpacing | 2 | 2
AntiAlias=1
DynamicVariables=1

; Year & Week Diagnostic Info
[MeterYearWeek]
Meter=String
MeasureName=MeasureYear
MeasureName2=MeasureWeekNumber
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(8.5*#Scale#)
X=(120*#Scale#)
Y=(46*#Scale#)
Text="STARK-EPOCH : %1 [WK %2]"
InlineSetting=CharacterSpacing | 1 | 1
AntiAlias=1
DynamicVariables=1

; Technical Status Indicator
[MeterStatusBadge]
Meter=Shape
Shape=Rectangle (120*#Scale#),(74*#Scale#),(165*#Scale#),(18*#Scale#),2 | Fill Color #ColorDark# | Stroke Color #ColorAccent# | StrokeWidth (0.8*#Scale#)
Shape2=Ellipse (130*#Scale#),(83*#Scale#),(3*#Scale#),(3*#Scale#) | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1

[MeterStatusText]
Meter=String
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(6.5*#Scale#)
X=(140*#Scale#)
Y=(76*#Scale#)
Text="STARK SATELLITE SYNC: ACTIVE"
AntiAlias=1
DynamicVariables=1
