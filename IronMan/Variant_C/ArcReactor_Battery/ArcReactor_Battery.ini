; =============================================================
; IRON MAN SUITE — ARC REACTOR BATTERY CORE
; Circular reactor fuel gauge, charging pulse indicator
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
Group=IronMan
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
@includeThemeOverride=#@#Variables_3A_HeavyCrimson.inc
Scale=1.1

; =============================================================
; MEASURES
; =============================================================

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
MinValue=0
MaxValue=100

[MeasureBatteryStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status
Substitute="0":"NO BATTERY","1":"AC CHARGING","2":"CRITICAL","3":"LOW CAPACITY","4":"PALADIUM CORE"

[MeasureBatteryLifetime]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Lifetime
Format=%H:%M REMAINING
Substitute="Unknown":""

; =============================================================
; METERS — CIRCULAR ARC REACTOR BATTERY
; =============================================================

; Tech Frame
[MeterBatteryFrame]
Meter=Shape
Shape=Ellipse (75*#Scale#),(75*#Scale#),(70*#Scale#),(70*#Scale#) | Stroke Color #ColorPanelBorder# | StrokeWidth (1*#Scale#) | StrokeDashes 4, 8 | Fill Color #ColorPanelBg#
Shape2=Ellipse (75*#Scale#),(75*#Scale#),(62*#Scale#),(62*#Scale#) | Stroke Color #ColorGrid# | StrokeWidth (1.2*#Scale#) | Fill Color 0,0,0,0
X=0
Y=0
DynamicVariables=1

; Background Track
[MeterReactorTrack]
Meter=Roundline
X=0
Y=0
W=(150*#Scale#)
H=(150*#Scale#)
StartAngle=(Rad(-90))
RotationAngle=(Rad(360))
LineLength=(58*#Scale#)
LineStart=(48*#Scale#)
LineColor=#ColorGrid#
Solid=1
AntiAlias=1
DynamicVariables=1

; Active Battery Level Arc
[MeterReactorActiveLevel]
Meter=Roundline
MeasureName=MeasureBattery
X=0
Y=0
W=(150*#Scale#)
H=(150*#Scale#)
StartAngle=(Rad(-90))
RotationAngle=(Rad(360))
LineLength=(58*#Scale#)
LineStart=(48*#Scale#)
LineColor=#ColorAccent#
Solid=1
AntiAlias=1
DynamicVariables=1

; Inner Plate
[MeterInnerCorePlate]
Meter=Shape
Shape=Ellipse (75*#Scale#),(75*#Scale#),(44*#Scale#),(44*#Scale#) | Fill Color #ColorDark# | Stroke Color #ColorWireframe# | StrokeWidth (1*#Scale#)
X=0
Y=0
DynamicVariables=1

; Arc Core Center Icon / Text
[MeterCoreHeader]
Meter=String
Text="REACTOR"
StringAlign=Center
FontFace=Space Mono
FontColor=#ColorMuted#
FontSize=(5.5*#Scale#)
X=(75*#Scale#)
Y=(46*#Scale#)
InlineSetting=CharacterSpacing | 1 | 1
AntiAlias=1
DynamicVariables=1

; Battery Percentage
[MeterBatteryValue]
Meter=String
MeasureName=MeasureBattery
StringAlign=Center
FontFace=Gobold Bold
FontColor=#ColorPrimary#
FontSize=(18*#Scale#)
X=(75*#Scale#)
Y=(56*#Scale#)
Text="%1%"
InlineSetting=Shadow | 0 | 0 | (8*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

; Status Text Inside Core
[MeterBatteryState]
Meter=String
MeasureName=MeasureBatteryStatus
StringAlign=Center
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(5.5*#Scale#)
X=(75*#Scale#)
Y=(84*#Scale#)
InlineSetting=CharacterSpacing | 0.8 | 0.8
AntiAlias=1
DynamicVariables=1

; Subtitle below gauge
[MeterBottomLabel]
Meter=String
MeasureName=MeasureBatteryLifetime
Text="OUTPUT // %1"
StringAlign=Center
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(6.5*#Scale#)
X=(75*#Scale#)
Y=(152*#Scale#)
AntiAlias=1
DynamicVariables=1
