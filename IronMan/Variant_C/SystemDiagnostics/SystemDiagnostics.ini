; =============================================================
; IRON MAN SUITE — SYSTEM TELEMETRY & DIAGNOSTICS
; CPU, RAM, and Disk HUD diagnostics with nano-tech bars
; =============================================================

[Rainmeter]
Update=1500
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
Group=IronMan
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
@includeThemeOverride=#@#Variables_3A_HeavyCrimson.inc
Scale=0.95
BarW=230
BarH=4

; =============================================================
; MEASURES
; =============================================================

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory
Total=0

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
Total=0
InvertMeasure=1

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1

; =============================================================
; METERS
; =============================================================

; Outer HUD Diagnostic Frame
[MeterSysFrame]
Meter=Shape
Shape=Rectangle 0,0,(280*#Scale#),(180*#Scale#),4 | Fill Color #ColorPanelBg# | Stroke Color #ColorPanelBorder# | StrokeWidth (1*#Scale#)
Shape2=Path TechCorner | Stroke Color #ColorAccent# | StrokeWidth (2*#Scale#) | Fill Color 0,0,0,0
TechCorner=LineTo (30*#Scale#),0 | MoveTo 0,0 | LineTo 0,(30*#Scale#)
Shape3=Rectangle (15*#Scale#),(32*#Scale#),(250*#Scale#),(1*#Scale#) | Fill Color #ColorGrid# | StrokeWidth 0
X=0
Y=0
DynamicVariables=1

; Header
[MeterSysHeader]
Meter=String
Text="STARK SUIT // HARDWARE TELEMETRY"
FontFace=Porter
FontColor=#ColorPrimary#
FontSize=(7.5*#Scale#)
X=(16*#Scale#)
Y=(12*#Scale#)
InlineSetting=CharacterSpacing | 1.5 | 1.5
AntiAlias=1
DynamicVariables=1

[MeterSubHeader]
Meter=String
Text="SYS.MONITOR // REALTIME"
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(6.5*#Scale#)
X=(16*#Scale#)
Y=(22*#Scale#)
AntiAlias=1
DynamicVariables=1

; ===================== CPU =====================
[MeterCPULabel]
Meter=String
Text="CPU THRUSTERS"
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(7*#Scale#)
X=(16*#Scale#)
Y=(42*#Scale#)
AntiAlias=1
DynamicVariables=1

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
FontFace=Gobold Bold
FontColor=#ColorPrimary#
FontSize=(14*#Scale#)
X=(264*#Scale#)
Y=(36*#Scale#)
StringAlign=Right
Text="%1%"
InlineSetting=Shadow | 0 | 0 | (6*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

; CPU Bar Background
[MeterCPUBarBg]
Meter=Shape
Shape=Rectangle (16*#Scale#),(58*#Scale#),(#BarW#*#Scale#),(#BarH#*#Scale#),1 | Fill Color #ColorGrid# | StrokeWidth 0
DynamicVariables=1

; CPU Bar Active
[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
BarColor=#ColorAccent#
BarOrientation=Horizontal
X=(16*#Scale#)
Y=(58*#Scale#)
W=(#BarW#*#Scale#)
H=(#BarH#*#Scale#)
DynamicVariables=1

; ===================== RAM =====================
[MeterRAMLabel]
Meter=String
Text="MEMORY BUFFER"
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(7*#Scale#)
X=(16*#Scale#)
Y=(74*#Scale#)
AntiAlias=1
DynamicVariables=1

[MeterRAMValue]
Meter=String
MeasureName=MeasureRAM
FontFace=Gobold Bold
FontColor=#ColorPrimary#
FontSize=(14*#Scale#)
X=(264*#Scale#)
Y=(68*#Scale#)
StringAlign=Right
AutoScale=1
NumOfDecimals=1
Text="%1B"
InlineSetting=Shadow | 0 | 0 | (6*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

; RAM Bar Background
[MeterRAMBarBg]
Meter=Shape
Shape=Rectangle (16*#Scale#),(90*#Scale#),(#BarW#*#Scale#),(#BarH#*#Scale#),1 | Fill Color #ColorGrid# | StrokeWidth 0
DynamicVariables=1

; RAM Bar Active
[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
MeasureName2=MeasureRAMTotal
BarColor=#ColorAccent#
BarOrientation=Horizontal
X=(16*#Scale#)
Y=(90*#Scale#)
W=(#BarW#*#Scale#)
H=(#BarH#*#Scale#)
DynamicVariables=1

; ===================== DISK =====================
[MeterDiskLabel]
Meter=String
Text="DATA STORAGE [C:]"
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(7*#Scale#)
X=(16*#Scale#)
Y=(106*#Scale#)
AntiAlias=1
DynamicVariables=1

[MeterDiskValue]
Meter=String
MeasureName=MeasureDisk
FontFace=Gobold Bold
FontColor=#ColorPrimary#
FontSize=(14*#Scale#)
X=(264*#Scale#)
Y=(100*#Scale#)
StringAlign=Right
AutoScale=1
NumOfDecimals=0
Text="%1B"
InlineSetting=Shadow | 0 | 0 | (6*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

; Disk Bar Background
[MeterDiskBarBg]
Meter=Shape
Shape=Rectangle (16*#Scale#),(122*#Scale#),(#BarW#*#Scale#),(#BarH#*#Scale#),1 | Fill Color #ColorGrid# | StrokeWidth 0
DynamicVariables=1

; Disk Bar Active
[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDisk
MeasureName2=MeasureDiskTotal
BarColor=#ColorAccent#
BarOrientation=Horizontal
X=(16*#Scale#)
Y=(122*#Scale#)
W=(#BarW#*#Scale#)
H=(#BarH#*#Scale#)
DynamicVariables=1

; Diagnostic Status Footer
[MeterSysFooter]
Meter=String
Text="ARMOR INTEGRITY: 100% // STATUS: NOMINAL"
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(6*#Scale#)
X=(16*#Scale#)
Y=(148*#Scale#)
InlineSetting=CharacterSpacing | 1 | 1
AntiAlias=1
DynamicVariables=1
