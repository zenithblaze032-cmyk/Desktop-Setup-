; =============================================================
; METERS
; =============================================================

; Frame
[MeterVisFrame]
Meter=Shape
Shape=Rectangle 0,0,(235*#Scale#),(90*#Scale#),4 | Fill Color #ColorPanelBg# | Stroke Color #ColorPanelBorder# | StrokeWidth (1*#Scale#)
Shape2=Path VisCorner | Stroke Color #ColorAccent# | StrokeWidth (2*#Scale#) | Fill Color 0,0,0,0
VisCorner=LineTo (20*#Scale#),0 | MoveTo 0,0 | LineTo 0,(20*#Scale#)
Shape3=Rectangle (12*#Scale#),(24*#Scale#),(210*#Scale#),(1*#Scale#) | Fill Color #ColorGrid# | StrokeWidth 0
X=0
Y=0
DynamicVariables=1

; Header
[MeterVisHeader]
Meter=String
Text="ACOUSTIC FLUX // SPECTRUM"
FontFace=Porter
FontColor=#ColorPrimary#
FontSize=(7*#Scale#)
X=(14*#Scale#)
Y=(10*#Scale#)
InlineSetting=CharacterSpacing | 1.5 | 1.5
AntiAlias=1
DynamicVariables=1

; Audio Bars (16 Bands)
[MeterBar0]
Meter=Bar
MeasureName=MeasureBand0
BarColor=#ColorAccent#
BarOrientation=Vertical
X=(16*#Scale#)
Y=(34*#Scale#)
W=(#BarW#*#Scale#)
H=(#VisH#*#Scale#)
DynamicVariables=1

[MeterBar1]
Meter=Bar
MeasureName=MeasureBand1
BarColor=#ColorAccent#
BarOrientation=Vertical
X=((16 + (#BarW#+#BarGap#)*1)*#Scale#)
Y=(34*#Scale#)
W=(#BarW#*#Scale#)
H=(#VisH#*#Scale#)
DynamicVariables=1

