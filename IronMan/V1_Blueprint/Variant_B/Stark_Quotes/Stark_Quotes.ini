; =============================================================
; IRON MAN SUITE — TONY STARK & JARVIS QUOTES HUD
; Curated Tony Stark, JARVIS, and FRIDAY quotes rotation
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
Group=IronMan
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=1.15

; =============================================================
; MEASURES — ROTATE EVERY 5 MINUTES (300s)
; =============================================================

[MeasureQuoteIndex]
Measure=Calc
Formula=Floor(TimeStamp / 300) MOD 10
DynamicVariables=1

[MeasureQ1]
Measure=String
String=[MeasureQuoteIndex]
Substitute="0":"I am Iron Man.","1":"Sometimes you gotta run","2":"Part of the journey","3":"Heroes are made by the path they choose,","4":"If we can't protect the Earth,","5":"JARVIS, sometimes you gotta run","6":"No amount of money","7":"Everything's gonna work out","8":"Give me a scotch,","9":"My armor was never a distraction or a hobby,"
DynamicVariables=1

[MeasureQ2]
Measure=String
String=[MeasureQuoteIndex]
Substitute="0":"The truth is... I am Iron Man.","1":"before you can walk.","2":"is the end.","3":"not the powers they are graced with.","4":"you can be damn sure we'll avenge it.","5":"before you can walk.","6":"ever bought a second of time.","7":"exactly the way it's supposed to.","8":"I'm starving.","9":"it was a cocoon. And now I'm a changed man."
DynamicVariables=1

[MeasureQAuthor]
Measure=String
String=[MeasureQuoteIndex]
Substitute="0":"— Tony Stark, Iron Man (2008)","1":"— Tony Stark, Mark II Flight Test","2":"— Tony Stark, Avengers: Endgame","3":"— Iron Man","4":"— Tony Stark, The Avengers (2012)","5":"— J.A.R.V.I.S. Protocol","6":"— Tony Stark","7":"— Tony Stark, Message to Morgan","8":"— Tony Stark, The Avengers","9":"— Tony Stark, Iron Man 3"
DynamicVariables=1

; =============================================================
; METERS
; =============================================================

; Tech Frame
[MeterQuoteFrame]
Meter=Shape
Shape=Rectangle 0,0,(310*#Scale#),(110*#Scale#),4 | Fill Color #ColorPanelBg# | Stroke Color #ColorPanelBorder# | StrokeWidth (1*#Scale#)
Shape2=Path QuoteCorner | Stroke Color #ColorAccent# | StrokeWidth (2*#Scale#) | Fill Color 0,0,0,0
QuoteCorner=LineTo (25*#Scale#),0 | MoveTo 0,0 | LineTo 0,(25*#Scale#)
Shape3=Rectangle (14*#Scale#),(92*#Scale#),(282*#Scale#),(1*#Scale#) | Fill Color #ColorGrid# | StrokeWidth 0
X=0
Y=0
DynamicVariables=1

; Header
[MeterQuoteHeader]
Meter=String
Text="STARK ARCHIVES // AUDIO LOG"
FontFace=Porter
FontColor=#ColorPrimary#
FontSize=(7*#Scale#)
X=(16*#Scale#)
Y=(12*#Scale#)
InlineSetting=CharacterSpacing | 1.5 | 1.5
AntiAlias=1
DynamicVariables=1

; Line 1
[MeterQuoteLine1]
Meter=String
MeasureName=MeasureQ1
FontFace=Space Mono
FontStyle=Bold
FontColor=#ColorHighlight#
FontSize=(9.5*#Scale#)
X=(16*#Scale#)
Y=(26*#Scale#)
W=(275*#Scale#)
ClipString=2
Text="%1"
InlineSetting=Shadow | 0 | 0 | (6*#Scale#) | #GlowPrimary#
AntiAlias=1
DynamicVariables=1

; Line 2
[MeterQuoteLine2]
Meter=String
MeasureName=MeasureQ2
FontFace=Space Mono
FontColor=#ColorSecondary#
FontSize=(8.5*#Scale#)
X=(16*#Scale#)
Y=(46*#Scale#)
W=(275*#Scale#)
ClipString=2
Text="%1"
AntiAlias=1
DynamicVariables=1

; Author
[MeterQuoteAuthor]
Meter=String
MeasureName=MeasureQAuthor
FontFace=Porter
FontColor=#ColorAccent#
FontSize=(6.5*#Scale#)
X=(16*#Scale#)
Y=(74*#Scale#)
InlineSetting=CharacterSpacing | 1 | 1
AntiAlias=1
DynamicVariables=1

; Log ID
[MeterLogId]
Meter=String
MeasureName=MeasureQuoteIndex
FontFace=Space Mono
FontColor=#ColorMuted#
FontSize=(6*#Scale#)
X=(294*#Scale#)
Y=(74*#Scale#)
StringAlign=Right
Text="LOG #%1/10"
AntiAlias=1
DynamicVariables=1

; Bottom Status
[MeterQuoteFooter]
Meter=String
Text="ARCHIVE PLAYBACK STATUS: NOMINAL"
FontFace=Space Mono
FontColor=#ColorMuted#
FontSize=(5.5*#Scale#)
X=(16*#Scale#)
Y=(96*#Scale#)
AntiAlias=1
DynamicVariables=1
