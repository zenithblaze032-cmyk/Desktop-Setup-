; =============================================================
; IRON MAN SUITE — STARK OS APP LAUNCHER HUD
; Quick launch dock for essential programs with hover effects
; =============================================================

[Rainmeter]
Update=500
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
Group=IronMan
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.3 ? 0.3 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=1.1

; =============================================================
; METERS
; =============================================================

; Frame
[MeterDockFrame]
Meter=Shape
Shape=Rectangle 0,0,(310*#Scale#),(64*#Scale#),4 | Fill Color #ColorPanelBg# | Stroke Color #ColorPanelBorder# | StrokeWidth (1*#Scale#)
Shape2=Path LauncherCorner | Stroke Color #ColorAccent# | StrokeWidth (2*#Scale#) | Fill Color 0,0,0,0
LauncherCorner=LineTo (20*#Scale#),0 | MoveTo 0,0 | LineTo 0,(20*#Scale#)
Shape3=Rectangle (14*#Scale#),(22*#Scale#),(282*#Scale#),(1*#Scale#) | Fill Color #ColorGrid# | StrokeWidth 0
X=0
Y=0
DynamicVariables=1

; Header
[MeterLauncherHeader]
Meter=String
Text="STARK OS // TACTICAL QUICK LAUNCH"
FontFace=Porter
FontColor=#ColorPrimary#
FontSize=(7*#Scale#)
X=(16*#Scale#)
Y=(8*#Scale#)
InlineSetting=CharacterSpacing | 1.5 | 1.5
AntiAlias=1
DynamicVariables=1

; --- BUTTON 1: BROWSER ---
[MeterBtnBrowser]
Meter=String
Text="[ BROWSER ]"
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(7.5*#Scale#)
X=(16*#Scale#)
Y=(34*#Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["https://www.google.com"]
MouseOverAction=[!SetOption MeterBtnBrowser FontColor "#ColorHighlight#"][!UpdateMeter MeterBtnBrowser][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnBrowser FontColor "#ColorAccent#"][!UpdateMeter MeterBtnBrowser][!Redraw]

; --- BUTTON 2: CODE / IDE ---
[MeterBtnCode]
Meter=String
Text="[ CODE ]"
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(7.5*#Scale#)
X=(85*#Scale#)
Y=(34*#Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["code"]
MouseOverAction=[!SetOption MeterBtnCode FontColor "#ColorHighlight#"][!UpdateMeter MeterBtnCode][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnCode FontColor "#ColorAccent#"][!UpdateMeter MeterBtnCode][!Redraw]

; --- BUTTON 3: TERMINAL ---
[MeterBtnTerminal]
Meter=String
Text="[ SHELL ]"
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(7.5*#Scale#)
X=(142*#Scale#)
Y=(34*#Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["wt.exe"]
MouseOverAction=[!SetOption MeterBtnTerminal FontColor "#ColorHighlight#"][!UpdateMeter MeterBtnTerminal][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnTerminal FontColor "#ColorAccent#"][!UpdateMeter MeterBtnTerminal][!Redraw]

; --- BUTTON 4: EXPLORER ---
[MeterBtnExplorer]
Meter=String
Text="[ FILES ]"
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(7.5*#Scale#)
X=(200*#Scale#)
Y=(34*#Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["explorer.exe"]
MouseOverAction=[!SetOption MeterBtnExplorer FontColor "#ColorHighlight#"][!UpdateMeter MeterBtnExplorer][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnExplorer FontColor "#ColorAccent#"][!UpdateMeter MeterBtnExplorer][!Redraw]

; --- BUTTON 5: CONFIG ---
[MeterBtnSettings]
Meter=String
Text="[ CFG ]"
FontFace=Space Mono
FontColor=#ColorAccent#
FontSize=(7.5*#Scale#)
X=(258*#Scale#)
Y=(34*#Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["ms-settings:"]
MouseOverAction=[!SetOption MeterBtnSettings FontColor "#ColorHighlight#"][!UpdateMeter MeterBtnSettings][!Redraw]
MouseLeaveAction=[!SetOption MeterBtnSettings FontColor "#ColorAccent#"][!UpdateMeter MeterBtnSettings][!Redraw]
