; =============================================================
; DATE + TIME SKIN — v3 "RONIN"
; Kept from v2 — looked great in screenshot
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=1.2

[MeasureTime]
Measure=Time
Format=#Format#

[MeasureAmPm]
Measure=Time
Format="%p"

[MeasureDate]
Measure=Time
Format="%d"

[MeasureMonth]
Measure=Time
Format="%B"

; --- Ghost 日 kanji behind date ---
[MeterDateGhost]
Meter=String
Text="日"
StringAlign=Left
FontFace=Yu Gothic
FontColor=#KanjiGhost#
FontSize=(115*#Scale#)
X=(5*#Scale#)
Y=(2*#Scale#)
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; --- Large date number ---
[MeterDate]
Meter=String
MeasureName=MeasureDate
StringAlign=Left
FontFace=Gobold Bold
FontColor=#Color1#
FontSize=(120*#Scale#)
X=(10*#Scale#)
Y=(10*#Scale#)
Text="%1"
InlineSetting=Shadow | 0 | 2 | 8 | #ShadowDeep#
InlineSetting2=GradientColor | 90 | #TextGradLight# ; 0.0 | #Color1# ; 1.0
InlineSetting3=Shadow | 0 | 0 | 14 | #ShadowAura#
AntiAlias=1
DynamicVariables=1

; --- Vertical crimson bar (separator between date and month/time) ---
[MeterVerticalAccent]
Meter=Shape
Shape=Rectangle 0,0,(2*#Scale#),(60*#Scale#) | Fill LinearGradient CrimsonGrad | StrokeWidth 0
CrimsonGrad=90 | #CrimsonBright# ; 0.0 | #CrimsonAccent# ; 1.0
X=(178*#Scale#)
Y=(38*#Scale#)
UpdateDivider=-1
DynamicVariables=1

; --- Month label ---
[MeterMonth]
Meter=String
MeasureName=MeasureMonth
StringAlign=Left
StringCase=Upper
FontFace=Porter
FontColor=#Color1#
FontSize=(26*#Scale#)
X=(186*#Scale#)
Y=(38*#Scale#)
Text="%1"
InlineSetting=CharacterSpacing | 4 | 4
InlineSetting2=Shadow | 0 | 1 | 4 | #ShadowDeep#
InlineSetting3=GradientColor | 90 | #TextGradLight# ; 0.0 | #Color1# ; 1.0
InlineSetting4=Shadow | 0 | 0 | 8 | #ShadowAura#
AntiAlias=1
DynamicVariables=1

; --- Time ---
[Meter12hClock]
Meter=String
MeasureName=MeasureTime
MeasureName2=MeasureAmPm
StringAlign=Left
FontFace=Porter
FontColor=#Color2#
FontSize=(26*#Scale#)
X=(186*#Scale#)
Y=(84*#Scale#)
Text="%1 %2"
InlineSetting=CharacterSpacing | 3 | 3
InlineSetting2=Shadow | 0 | 1 | 2 | #ShadowColor#
AntiAlias=1
DynamicVariables=1

