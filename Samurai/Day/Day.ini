; =============================================================
; DAY SKIN — v3 "RONIN"
; Kept from v2 — ghost 侍 kanji + crimson underline accent
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=1.5

[MeasureDay]
Measure=Time
Format="%A"

; --- Ghost 侍 kanji (behind day text) ---
[MeterKanjiGhost]
Meter=String
Text="侍"
StringAlign=Center
FontFace=Yu Gothic
FontColor=#KanjiGhost#
FontSize=(110*#Scale#)
X=(180*#Scale#)
Y=(-20*#Scale#)
W=(360*#Scale#)
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; --- Day text ---
[MeterDay]
Meter=String
MeasureName=MeasureDay
StringAlign=Center
StringCase=Upper
FontFace=Anurati
FontColor=#Color1#
FontSize=(28*#Scale#)
X=(180*#Scale#)
Y=(22*#Scale#)
W=(360*#Scale#)
Text="%1"
InlineSetting=CharacterSpacing | 16 | 16
InlineSetting2=Shadow | 0 | 1 | 4 | #ShadowColor#
AntiAlias=1
DynamicVariables=1

; --- Crimson underline accent ---
[MeterDayAccent]
Meter=Shape
Shape=Rectangle 0,0,(125*#Scale#),(1.5*#Scale#) | Fill Color #CrimsonAccent# | StrokeWidth 0
X=((180*#Scale# + 180*#Scale#/2 - 130*#Scale#/2))
Y=(62*#Scale#)
UpdateDivider=-1
DynamicVariables=1
