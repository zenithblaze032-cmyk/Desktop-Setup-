; =============================================================
; SYSTEMSTATS.ini — v1 "SPIDER-VERSE"
; CPU / RAM / DISK resources with Spider-Man accent bars + web ghost
; =============================================================

[Rainmeter]
Update=2000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.ini
Scale=1.15
BarW=160
BarH=2

; =============================================================
; MEASURES
; =============================================================

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory
Total=0

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
Total=0
InvertMeasure=1

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1

; =============================================================
; METERS
; =============================================================

; --- Top rule ---
[MeterTopRule]
Meter=Shape
Shape=Rectangle 0,0,(200*#Scale#),(1*#Scale#) | Fill Color #LineColor# | StrokeWidth 0
X=0
Y=0
UpdateDivider=-1
DynamicVariables=1

; --- Ghost web stack (far right, decorative) ---
[MeterStatsWebGhost]
Meter=Shape
Shape=Ellipse 175,60,42,42 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape2=Ellipse 175,60,28,28 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape3=Line 133,60,217,60 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape4=Line 175,18,175,102 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape5=Line 133,24,217,96 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape6=Line 133,96,217,24 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
X=0
Y=10
DynamicVariables=1
UpdateDivider=-1

; ===== CPU =====

[MeterCPULabel]
Meter=String
Text="SPIDER CORE"
StringAlign=Left
FontFace=Porter
FontColor=#Color3#
FontSize=(8*#Scale#)
X=(0*#Scale#)
Y=(10*#Scale#)
InlineSetting=CharacterSpacing | 3 | 3
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
StringAlign=Right
FontFace=Gobold Bold
FontColor=#Color1#
FontSize=(20*#Scale#)
X=((#BarW#+40)*#Scale#)
Y=(6*#Scale#)
Text="%1%"
AntiAlias=1
DynamicVariables=1

[MeterCPUBarBG]
Meter=Shape
Shape=Rectangle 0,0,(#BarW#*#Scale#),(#BarH#*#Scale#) | Fill Color #Color3#,35 | StrokeWidth 0
X=(0*#Scale#)
Y=(35*#Scale#)
UpdateDivider=-1
DynamicVariables=1

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
BarColor=#SpiderRed#
BarOrientation=Horizontal
X=(0*#Scale#)
Y=(35*#Scale#)
W=(#BarW#*#Scale#)
H=(#BarH#*#Scale#)
DynamicVariables=1

; ===== RAM =====

[MeterRAMLabel]
Meter=String
Text="RAM MEMORY"
StringAlign=Left
FontFace=Porter
FontColor=#Color3#
FontSize=(8*#Scale#)
X=(0*#Scale#)
Y=(44*#Scale#)
InlineSetting=CharacterSpacing | 3 | 3
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

[MeterRAMValue]
Meter=String
MeasureName=MeasureRAM
StringAlign=Right
FontFace=Gobold Bold
FontColor=#Color1#
FontSize=(20*#Scale#)
AutoScale=1
NumOfDecimals=1
X=((#BarW#+40)*#Scale#)
Y=(40*#Scale#)
Text="%1B"
AntiAlias=1
DynamicVariables=1

[MeterRAMBarBG]
Meter=Shape
Shape=Rectangle 0,0,(#BarW#*#Scale#),(#BarH#*#Scale#) | Fill Color #Color3#,35 | StrokeWidth 0
X=(0*#Scale#)
Y=(74*#Scale#)
UpdateDivider=-1
DynamicVariables=1

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
MeasureName2=MeasureRAMTotal
BarColor=#NavyBlue#
BarOrientation=Horizontal
X=(0*#Scale#)
Y=(74*#Scale#)
W=(#BarW#*#Scale#)
H=(#BarH#*#Scale#)
DynamicVariables=1

; ===== DISK =====

[MeterDiskLabel]
Meter=String
Text="DISK  C:"
StringAlign=Left
FontColor=#Color3#
FontFace=Porter
FontSize=(8*#Scale#)
X=(0*#Scale#)
Y=(96*#Scale#)
InlineSetting=CharacterSpacing | 3 | 3
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

[MeterDiskValue]
Meter=String
MeasureName=MeasureDisk
StringAlign=Right
FontFace=Gobold Bold
FontColor=#Color1#
FontSize=(20*#Scale#)
AutoScale=1
NumOfDecimals=1
X=((#BarW#+40)*#Scale#)
Y=(92*#Scale#)
Text="%1B"
AntiAlias=1
DynamicVariables=1

[MeterDiskBarBG]
Meter=Shape
Shape=Rectangle 0,0,(#BarW#*#Scale#),(#BarH#*#Scale#) | Fill Color #Color3#,35 | StrokeWidth 0
X=(0*#Scale#)
Y=(126*#Scale#)
UpdateDivider=-1
DynamicVariables=1

[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDisk
MeasureName2=MeasureDiskTotal
BarColor=#SpiderRed#
BarOrientation=Horizontal
X=(0*#Scale#)
Y=(126*#Scale#)
W=(#BarW#*#Scale#)
H=(#BarH#*#Scale#)
DynamicVariables=1

; --- Bottom rule ---
[MeterBottomRule]
Meter=Shape
Shape=Rectangle 0,0,(200*#Scale#),(1*#Scale#) | Fill Color #LineColor# | StrokeWidth 0
X=0
Y=(150*#Scale#)
UpdateDivider=-1
DynamicVariables=1