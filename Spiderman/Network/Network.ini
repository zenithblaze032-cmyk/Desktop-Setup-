; =============================================================
; NETWORK SKIN — v3 "SPIDERMAN" EDITION  FIX
; PROBLEM IN v2: Labels were cramped into ghost kanji overlay
; FIX: Ghost kanji moved to non-overlapping position,
;      Labels given proper padding and size hierarchy,
;      Layout: stacked rows with generous vertical spacing
; =============================================================

[Rainmeter]
Update=2000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=1.45

; =============================================================
; MEASURES
; =============================================================

[MeasureNetIn]
Measure=NetIn
Interface=0

[MeasureNetOut]
Measure=NetOut
Interface=0

; =============================================================
; METERS — Clean stacked layout, no overlap
; =============================================================

; --- Top rule ---
[MeterTopRule]
Meter=Shape
Shape=Rectangle 0,0,(180*#Scale#),(1*#Scale#) | Fill LinearGradient MyGradient | StrokeWidth 0
MyGradient=0 | #ThemeBlackLight# ; 0.0 | #ThemeBlack# ; 1.0
X=0
Y=0
UpdateDivider=-1
DynamicVariables=1

; --- Ghost kanji — pushed far right, won't overlap text ---
[MeterNetGhost]
Meter=String
Text="🕸"
StringAlign=Right
FontFace=Segoe UI Emoji
FontColor=#ThemeWatermark#
FontSize=(70*#Scale#)
X=(180*#Scale#)
Y=(0*#Scale#)
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; =====================
; DOWNLOAD ROW
; =====================

; Label — small, spaced, above value
[MeterDownLabel]
Meter=String
Text="▼  DOWNLOAD"
StringAlign=Left
FontFace=Porter
FontColor=#ThemeBlack#
FontSize=(8*#Scale#)
X=(0*#Scale#)
Y=(10*#Scale#)
InlineSetting=CharacterSpacing | 2 | 2
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; Value — large, bold, below label
[MeterDownValue]
Meter=String
MeasureName=MeasureNetIn
StringAlign=Left
FontFace=Gobold Bold
FontColor=#ThemeRed#
FontSize=(22*#Scale#)
AutoScale=1
NumOfDecimals=1
X=(0*#Scale#)
Y=(22*#Scale#)
Text="%1B/s"
InlineSetting=GradientColor | 0 | #ThemeRedBright# ; 0.0 | #ThemeRed# ; 1.0
InlineSetting2=Shadow | 0 | 0 | 10 | #ThemeRedGlow#
AntiAlias=1
DynamicVariables=1

; =====================
; THIN DIVIDER
; =====================
[MeterNetMidRule]
Meter=Shape
Shape=Rectangle 0,0,(80*#Scale#),(0.8*#Scale#) | Fill LinearGradient MyGradient | StrokeWidth 0
MyGradient=0 | #ThemeBlackLight# ; 0.0 | #ThemeBlack# ; 1.0
X=0
Y=(62*#Scale#)
UpdateDivider=-1
DynamicVariables=1

; =====================
; UPLOAD ROW
; =====================

; Label
[MeterUpLabel]
Meter=String
Text="▲  UPLOAD"
StringAlign=Left
FontFace=Porter
FontColor=#ThemeBlack#
FontSize=(8*#Scale#)
X=(0*#Scale#)
Y=(60*#Scale#)
InlineSetting=CharacterSpacing | 2 | 2
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; Value
[MeterUpValue]
Meter=String
MeasureName=MeasureNetOut
StringAlign=Left
FontFace=Gobold Bold
FontColor=#ThemeRed#
FontSize=(22*#Scale#)
AutoScale=1
NumOfDecimals=1
X=(0*#Scale#)
Y=(72*#Scale#)
Text="%1B/s"
InlineSetting=GradientColor | 0 | #ThemeRedBright# ; 0.0 | #ThemeRed# ; 1.0
InlineSetting2=Shadow | 0 | 0 | 10 | #ThemeRedGlow#
AntiAlias=1
DynamicVariables=1

; --- Bottom rule ---
[MeterBottomRule]
Meter=Shape
Shape=Rectangle 0,0,(180*#Scale#),(1*#Scale#) | Fill LinearGradient MyGradient | StrokeWidth 0
MyGradient=0 | #ThemeBlackLight# ; 0.0 | #ThemeBlack# ; 1.0
X=0
Y=(120*#Scale#)
UpdateDivider=-1
DynamicVariables=1

