; =============================================================
; NETWORK.ini — v1 "SPIDER-VERSE"
; Download / Upload rows with ghost web watermark
; =============================================================

[Rainmeter]
Update=2000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.ini
Scale=1.45

; =============================================================
; MEASURES
; =============================================================

[MeasureNetIn]
Measure=NetIn
Interface=0

[MeasureNetOut]
Measure=NetOut
Interface=0

; =============================================================
; METERS — Clean stacked layout, no overlap
; =============================================================

; --- Top rule ---
[MeterTopRule]
Meter=Shape
Shape=Rectangle 0,0,(180*#Scale#),(1*#Scale#) | Fill Color #LineColor# | StrokeWidth 0
X=0
Y=0
UpdateDivider=-1
DynamicVariables=1

; --- Ghost web watermark — pushed far right ---
[MeterNetWebGhost]
Meter=Shape
Shape=Ellipse 150,60,38,38 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape2=Ellipse 150,60,26,26 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape3=Ellipse 150,60,13,13 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape4=Line 112,60,188,60 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape5=Line 150,22,150,98 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape6=Line 112,29,188,91 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape7=Line 112,91,188,29 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
X=0
Y=0
DynamicVariables=1
UpdateDivider=-1

; =====================
; DOWNLOAD ROW
; =====================

[MeterDownLabel]
Meter=String
Text="▼  WEB ACTIVITY / DOWN"
StringAlign=Left
FontFace=Porter
FontColor=#NavyBlue#
FontSize=(8*#Scale#)
X=(0*#Scale#)
Y=(10*#Scale#)
InlineSetting=CharacterSpacing | 2 | 2
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

[MeterDownValue]
Meter=String
MeasureName=MeasureNetIn
StringAlign=Left
FontFace=Gobold Bold
FontColor=#Color1#
FontSize=(22*#Scale#)
AutoScale=1
NumOfDecimals=1
X=(0*#Scale#)
Y=(22*#Scale#)
Text="%1B/s"
AntiAlias=1
DynamicVariables=1

; =====================
; THIN DIVIDER
; =====================
[MeterNetMidRule]
Meter=Shape
Shape=Rectangle 0,0,(80*#Scale#),(0.8*#Scale#) | Fill Color #Color3#,60 | StrokeWidth 0
X=0
Y=(62*#Scale#)
UpdateDivider=-1
DynamicVariables=1

; =====================
; UPLOAD ROW
; =====================

[MeterUpLabel]
Meter=String
Text="▲  WEB ACTIVITY / UP"
StringAlign=Left
FontFace=Porter
FontColor=#SpiderRed#
FontSize=(8*#Scale#)
X=(0*#Scale#)
Y=(60*#Scale#)
InlineSetting=CharacterSpacing | 2 | 2
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

[MeterUpValue]
Meter=String
MeasureName=MeasureNetOut
StringAlign=Left
FontFace=Gobold Bold
FontColor=#Color1#
FontSize=(22*#Scale#)
AutoScale=1
NumOfDecimals=1
X=(0*#Scale#)
Y=(72*#Scale#)
Text="%1B/s"
AntiAlias=1
DynamicVariables=1

; --- Bottom rule ---
[MeterBottomRule]
Meter=Shape
Shape=Rectangle 0,0,(180*#Scale#),(1*#Scale#) | Fill Color #LineColor# | StrokeWidth 0
X=0
Y=(120*#Scale#)
UpdateDivider=-1
DynamicVariables=1