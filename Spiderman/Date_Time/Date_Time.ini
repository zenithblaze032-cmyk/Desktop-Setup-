; =============================================================
; DATE_TIME.ini — v1 "SPIDER-VERSE"
; Big day-number clock with ghost web watermark + Spider-Red bar
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.ini
Scale=1.2

[MeasureTime]
Measure=Time
Format=#Format#

[MeasureAmPm]
Measure=Time
Format="%p"

[MeasureDate]
Measure=Time
Format="%d"

[MeasureMonth]
Measure=Time
Format="%B"

; --- Ghost web watermark (replaces kanji behind date) ---
[MeterDateWebGhost]
Meter=Shape
Shape=Ellipse 65,62,70,70 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape2=Ellipse 65,62,48,48 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape3=Ellipse 65,62,28,28 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape4=Line 0,62,130,62 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape5=Line 65,-8,65,132 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape6=Line 0,-16,130,140 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape7=Line 0,140,130,-16 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
X=0
Y=0
DynamicVariables=1
UpdateDivider=-1

; --- Large date number ---
[MeterDate]
Meter=String
MeasureName=MeasureDate
StringAlign=Left
FontFace=Gobold Bold
FontColor=#Color1#
FontSize=(120*#Scale#)
X=(10*#Scale#)
Y=(10*#Scale#)
Text="%1"
InlineSetting=Shadow | 0 | 2 | 8 | #ShadowColor#
AntiAlias=1
DynamicVariables=1

; --- Vertical Spider-Red bar (separator) ---
[MeterVerticalAccent]
Meter=Shape
Shape=Rectangle 0,0,(2*#Scale#),(60*#Scale#) | Fill Color #SpiderRed# | StrokeWidth 0
X=(178*#Scale#)
Y=(38*#Scale#)
UpdateDivider=-1
DynamicVariables=1

; --- Month label ---
[MeterMonth]
Meter=String
MeasureName=MeasureMonth
StringAlign=Left
StringCase=Upper
FontFace=Porter
FontColor=#Color1#
FontSize=(26*#Scale#)
X=(186*#Scale#)
Y=(38*#Scale#)
Text="%1"
InlineSetting=CharacterSpacing | 4 | 4
InlineSetting2=Shadow | 0 | 1 | 3 | #ShadowColor#
AntiAlias=1
DynamicVariables=1

; --- Time ---
[Meter12hClock]
Meter=String
MeasureName=MeasureTime
MeasureName2=MeasureAmPm
StringAlign=Left
FontFace=Porter
FontColor=#SpiderRed#
FontSize=(26*#Scale#)
X=(186*#Scale#)
Y=(84*#Scale#)
Text="%1 %2"
InlineSetting=CharacterSpacing | 3 | 3
InlineSetting2=Shadow | 0 | 1 | 2 | #ShadowColor#
AntiAlias=1
DynamicVariables=1