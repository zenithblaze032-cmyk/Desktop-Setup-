[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=1.25

[MeasureTime]
Measure=Time
Format=#Format#

[MeasureAmPm]
Measure=Time
Format="%p"

[MeasureDate]
Measure=Time
Format="%d"

[MeasureMonth]
Measure=Time
Format="%B"

; --- Ghost web watermark ---
[MeterDateGhost]
Meter=String
Text="🕸"
StringAlign=Left
FontFace=Segoe UI Emoji
FontColor=#ThemeWatermark#
FontSize=(115*#Scale#)
X=(5*#Scale#)
Y=(2*#Scale#)
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; --- Date: Neon Scarlet Red ---
[MeterDate]
Meter=String
MeasureName=MeasureDate
StringAlign=Left
FontFace=Gobold Bold
FontColor=#ThemeRed#
FontSize=(120*#Scale#)
X=(10*#Scale#)
Y=(10*#Scale#)
Text="%1"
InlineSetting=Shadow | 0 | 2 | 8 | #ThemeShadow#
InlineSetting2=GradientColor | 90 | #ThemeRedBright# ; 0.0 | #ThemeRed# ; 1.0
InlineSetting3=Shadow | 0 | 0 | 15 | #ThemeRedGlow#
AntiAlias=1
DynamicVariables=1

; --- Vertical separator: Solid Black ---
[MeterVerticalAccent]
Meter=Shape
Shape=Rectangle 0,0,(2.5*#Scale#),(60*#Scale#) | Fill LinearGradient MyGradient | StrokeWidth 0
MyGradient=90 | #ThemeBlackLight# ; 0.0 | #ThemeBlack# ; 1.0
X=(178*#Scale#)
Y=(38*#Scale#)
UpdateDivider=-1
DynamicVariables=1

; --- Month: Bright Coral Red ---
[MeterMonth]
Meter=String
MeasureName=MeasureMonth
StringAlign=Left
StringCase=Upper
FontFace=Porter
FontColor=#ThemeRed#
FontSize=(26*#Scale#)
X=(186*#Scale#)
Y=(38*#Scale#)
Text="%1"
InlineSetting=CharacterSpacing | 4 | 4
InlineSetting2=Shadow | 0 | 1 | 3 | #ThemeShadow#
InlineSetting3=GradientColor | 90 | #ThemeRedBright# ; 0.0 | #ThemeRed# ; 1.0
InlineSetting4=Shadow | 0 | 0 | 10 | #ThemeRedGlow#
AntiAlias=1
DynamicVariables=1

; --- Time: Vibrant Crimson ---
[Meter12hClock]
Meter=String
MeasureName=MeasureTime
MeasureName2=MeasureAmPm
StringAlign=Left
FontFace=Porter
FontColor=#ThemeGray#
FontSize=(26*#Scale#)
X=(186*#Scale#)
Y=(84*#Scale#)
Text="%1 %2"
InlineSetting=CharacterSpacing | 3 | 3
InlineSetting2=Shadow | 0 | 1 | 2 | #ThemeShadow#
AntiAlias=1
DynamicVariables=1
