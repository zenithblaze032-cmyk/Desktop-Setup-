; =============================================================
; DAY SKIN — v3 "SPIDERMAN"
; Kept from v2 — ghost 侍 kanji + crimson underline accent
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=2.45

[MeasureDay]
Measure=Time
Format="%A"


; --- Day text ---
[MeterDay]
Meter=String
MeasureName=MeasureDay
StringAlign=Center
StringCase=Upper
FontFace=Anurati
FontColor=136,39,56,255
FontSize=(28*#Scale#)
X=(180*#Scale#)
Y=(22*#Scale#)
W=(360*#Scale#)
Text="%1"
InlineSetting=CharacterSpacing | 16 | 16
InlineSetting2=GradientColor | 180 | 200,50,70,255 ; 0.0 | 136,39,56,255 ; 1.0
InlineSetting3=Shadow | 0 | 1 | 4 | 27,46,64,100
InlineSetting4=Shadow | 0 | 0 | 10 | 136,39,56,150
AntiAlias=1
DynamicVariables=1



