; =============================================================
; DAY.ini — v1 "SPIDER-VERSE"
; Day of week in Anurati with ghost web watermark + Spider-Red underline
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.ini
Scale=1.5

[MeasureDay]
Measure=Time
Format="%A"

; --- Ghost web watermark (replaces the 侍 kanji) ---
[MeterWebGhost]
Meter=Shape
Shape=Ellipse 180,40,75,75 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape2=Ellipse 180,40,50,50 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape3=Ellipse 180,40,28,28 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape4=Line 105,40,255,40 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape5=Line 180,-35,180,115 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape6=Line 105,-16,255,96 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape7=Line 105,96,255,-16 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
X=0
Y=0
DynamicVariables=1
UpdateDivider=-1

; --- Day text ---
[MeterDay]
Meter=String
MeasureName=MeasureDay
StringAlign=Center
StringCase=Upper
FontFace=Anurati
FontColor=#Color1#
FontSize=(28*#Scale#)
X=(180*#Scale#)
Y=(22*#Scale#)
W=(360*#Scale#)
Text="%1"
InlineSetting=CharacterSpacing | 16 | 16
InlineSetting2=Shadow | 0 | 1 | 4 | #ShadowColor#
AntiAlias=1
DynamicVariables=1

; --- Spider-Red underline accent (replaces the crimson bar) ---
[MeterDayAccent]
Meter=Shape
Shape=Rectangle 0,0,(125*#Scale#),(1.5*#Scale#) | Fill Color #SpiderRed# | StrokeWidth 0
X=((180*#Scale# + 180*#Scale#/2 - 130*#Scale#/2))
Y=(62*#Scale#)
UpdateDivider=-1
DynamicVariables=1