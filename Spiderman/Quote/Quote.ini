; =============================================================
; QUOTE SKIN — v3 "SPIDERMAN" EDITION  CURATED WARRIOR QUOTES
;
; Sources:
;   - Miyamoto Musashi  (Go Rin No Sho / Book of Five Rings)
;   - Sun Tzu           (The Art of War)
;   - Yamamoto Tsunetomo (Hagakure)
;   - Lao Tzu           (Tao Te Ching)
;   - Seneca            (Letters from a Stoic)
;
; Rotation: Every 5 minutes (300 seconds), cycles through 12 quotes
; No external plugins — pure Rainmeter String substitution
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=1.5

; =============================================================
; QUOTE INDEX — cycles every 5 minutes
; 12 total quotes (index 0–11)
; =============================================================

[MeasureQuoteIndex]
Measure=Calc
Formula=Floor(TimeStamp / 300) MOD 12
DynamicVariables=1

; =============================================================
; QUOTE LINE 1 — first part of quote
; =============================================================

[MeasureQ1]
Measure=String
String=[MeasureQuoteIndex]
Substitute="0":"Today is victory over yourself","1":"Do not seek the enemy outside,","2":"The supreme art of war","3":"He who knows others is wise;","4":"In the midst of chaos,","5":"You may advance and be","6":"If you know the enemy","7":"I have no fear of death,","8":"The true science of martial arts","9":"Appear weak when you are strong,","10":"The path of the warrior","11":"There is nothing outside of yourself"
DynamicVariables=1

; =============================================================
; QUOTE LINE 2 — second part of quote
; =============================================================

[MeasureQ2]
Measure=String
String=[MeasureQuoteIndex]
Substitute="0":"of yesterday; tomorrow is your victory over lesser men.","1":"seek him in yourself.","2":"is to subdue the enemy without fighting.","3":"he who knows himself is enlightened.","4":"there is also opportunity.","5":"absolute ruin if you linger.","6":"and know yourself, you need not fear a hundred battles.","7":"only of failing while still alive.","8":"means knowing yourself.","9":"and strong when weak.","10":"is realized through mastery of the mind.","11":"that can give you success or failure."
DynamicVariables=1

; =============================================================
; QUOTE AUTHOR
; =============================================================

[MeasureQAuthor]
Measure=String
String=[MeasureQuoteIndex]
Substitute="0":"— Miyamoto Musashi","1":"— Miyamoto Musashi","2":"— Sun Tzu, The Art of War","3":"— Lao Tzu","4":"— Sun Tzu, The Art of War","5":"— Sun Tzu, The Art of War","6":"— Sun Tzu, The Art of War","7":"— Miyamoto Musashi","8":"— Miyamoto Musashi","9":"— Sun Tzu, The Art of War","10":"— Hagakure, Yamamoto Tsunetomo","11":"— Miyamoto Musashi, Go Rin No Sho"
DynamicVariables=1

; =============================================================
; METERS
; =============================================================

; --- Crimson top rule ---
[MeterTopRule]
Meter=Shape
Shape=Rectangle 0,0,(240*#Scale#),(1.5*#Scale#) | Fill Color #CrimsonAccent#,200 | StrokeWidth 0
X=0
Y=0
UpdateDivider=-1
DynamicVariables=1

; --- Ghost 武 kanji watermark ---
[MeterQuoteGhost]
Meter=String
Text="🕸"
StringAlign=Right
FontFace=Segoe UI Emoji
FontColor=#KanjiGhost#
FontSize=(80*#Scale#)
X=(240*#Scale#)
Y=(-5*#Scale#)
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; --- Quote line 1 ---
[MeterQ1]
Meter=String
MeasureName=MeasureQ1
StringAlign=Left
FontFace=IM Fell English
FontStyle=Italic
FontColor=#Color1#,220
FontSize=(10*#Scale#)
X=(8*#Scale#)
Y=(10*#Scale#)
W=(228*#Scale#)
ClipString=2
Text="%1"
AntiAlias=1
DynamicVariables=1

; --- Quote line 2 ---
[MeterQ2]
Meter=String
MeasureName=MeasureQ2
StringAlign=Left
FontFace=IM Fell English
FontStyle=Italic
FontColor=#Color1#,220
FontSize=(10*#Scale#)
X=(8*#Scale#)
Y=(26*#Scale#)
W=(228*#Scale#)
ClipString=2
Text="%1"
AntiAlias=1
DynamicVariables=1


; --- Author attribution ---
[MeterQAuthor]
Meter=String
MeasureName=MeasureQAuthor
StringAlign=Left
FontFace=Porter
FontColor=#Color3#
FontSize=(7.5*#Scale#)
X=(8*#Scale#)
Y=(68*#Scale#)
InlineSetting=CharacterSpacing | 1.5 | 1.5
Text="%1"
AntiAlias=1
DynamicVariables=1

; --- Bottom thin rule ---
[MeterBottomRule]
Meter=Shape
Shape=Rectangle 0,0,(240*#Scale#),(1*#Scale#) | Fill Color #LineColor# | StrokeWidth 0
X=0
Y=(86*#Scale#)
UpdateDivider=-1
DynamicVariables=1

