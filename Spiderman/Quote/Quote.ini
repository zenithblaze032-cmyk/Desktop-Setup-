; =============================================================
; QUOTE.ini - v1 "SPIDER-VERSE"
; Rotating Spider-Man-inspired quotes (every 12 minutes)
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables "Scale" "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables "Scale" "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.ini
Scale=1.0

; =============================================================
; MEASURES
; =============================================================

[MeasureQuoteIndex]
Measure=Calc
Formula=Floor(TimeStamp / 720) % 12
DynamicVariables=1

[MeasureQuoteText]
Measure=String
String=[MeasureQuoteIndex]
Substitute="0":"With great power comes great responsibility.","1":"When you can do the things that you can, you must.","2":"The world is not perfect, but it is worth saving.","3":"No matter how far you fall, you can rise again.","4":"Being brave is not about being fearless.","5":"Every day is a chance to do something right.","6":"A hero is never alone when people believe in them.","7":"I miss you, uncle Ben.","8":"With great hope comes great opportunity.","9":"The value is not in what you wear.","10":"Once you accept who you are, you become free.","11":"My whole duty is my social justice."
DynamicVariables=1

[MeasureQuoteAuthor]
Measure=String
String=[MeasureQuoteIndex]
Substitute="0":"-  Uncle Ben","1":"-  Peter Parker","2":"-  Spider-Man","3":"-  Peter Parker","4":"-  Spider-Man","5":"-  Peter Parker","6":"-  Spider-Man","7":"-  Peter Parker","8":"-  Spider-Man","9":"-  Peter Parker","10":"-  Spider-Man","11":"-  Spider-Man"
DynamicVariables=1

; =============================================================
; METERS
; =============================================================

; Spider-Red top rule
[MeterTopRule]
Meter=Shape
Shape=Rectangle 0,0,(240*#Scale#),(1.5*#Scale#) | Fill Color #SpiderRed# | StrokeWidth 0
X=0
Y=0
UpdateDivider=-1
DynamicVariables=1

; Ghost web watermark (decorative top-right)
[MeterWebGhost]
Meter=Shape
Shape=Ellipse 220,30,46,46 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape2=Ellipse 220,30,30,30 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape3=Line 174,30,266,30 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape4=Line 220,-16,220,76 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape5=Line 188,-8,252,68 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape6=Line 188,68,252,-8 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
X=0
Y=0
UpdateDivider=-1
DynamicVariables=1

; --- Quote text ---
[MeterQuote]
Meter=String
MeasureName=MeasureQuoteText
StringAlign=Left
FontFace=Quicksand
FontStyle=Italic
FontColor=#Color1#,230
FontSize=(11*#Scale#)
X=(8*#Scale#)
Y=(12*#Scale#)
W=(224*#Scale#)
ClipString=2
InlineSetting=CharacterSpacing | 1 | 1
Text="%1"
AntiAlias=1
DynamicVariables=1

; --- Author attribution ---
[MeterAuthor]
Meter=String
MeasureName=MeasureQuoteAuthor
StringAlign=Left
FontFace=Porter
FontColor=#SpiderRed#
FontSize=(7.5*#Scale#)
X=(8*#Scale#)
Y=(72*#Scale#)
InlineSetting=CharacterSpacing | 1 | 1
Text="%1"
AntiAlias=1
DynamicVariables=1

; --- Bottom thin rule ---
[MeterBottomRule]
Meter=Shape
Shape=Rectangle 0,0,(240*#Scale#),(1*#Scale#) | Fill Color #LineColor# | StrokeWidth 0
X=0
Y=(90*#Scale#)
UpdateDivider=-1
DynamicVariables=1