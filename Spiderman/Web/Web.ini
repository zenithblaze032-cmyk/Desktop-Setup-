; =============================================================
; WEB.ini — v1 "SPIDER-VERSE"  DECORATIVE TEAM
; A hanging spider web + small stylized spider.
; Place it near a screen corner like the wallpaper's web.
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.ini
Scale=1.0
ValueScale=1.0

; --- The web (concentric rings + radial spokes) ---
[MeterWeb]
Meter=Shape
X=0
Y=0
Shape=Ellipse 150,95,16,16 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape2=Ellipse 150,95,34,34 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape3=Ellipse 150,95,52,52 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape4=Ellipse 150,95,70,70 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape5=Line 150,25,150,165 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape6=Line 80,95,220,95 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape7=Line 100,48,200,142 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape8=Line 100,142,200,48 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape9=Line 130,58,170,132 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
Shape10=Line 130,132,170,58 | StrokeWidth (1*#Scale#) | Stroke Color #WebLine#
DynamicVariables=1
UpdateDivider=-1

; --- Spider body (Spider-Red) ---
[MeterSpider]
Meter=Shape
X=0
Y=0
Shape=Ellipse 150,95,14,18 | Fill Color #SpiderRed# | StrokeWidth 0
Shape2=Ellipse 150,88,8,8 | Fill Color #SpiderRed# | StrokeWidth 0
; legs
Shape3=Line 136,80,150,95 | StrokeWidth (2*#Scale#) | Stroke Color #SpiderRed#
Shape4=Line 164,80,150,95 | StrokeWidth (2*#Scale#) | Stroke Color #SpiderRed#
Shape5=Line 134,95,150,95 | StrokeWidth (2*#Scale#) | Stroke Color #SpiderRed#
Shape6=Line 166,95,150,95 | StrokeWidth (2*#Scale#) | Stroke Color #SpiderRed#
Shape7=Line 138,110,150,95 | StrokeWidth (2*#Scale#) | Stroke Color #SpiderRed#
Shape8=Line 162,110,150,95 | StrokeWidth (2*#Scale#) | Stroke Color #SpiderRed#
Shape9=Line 142,58,150,95 | StrokeWidth (2*#Scale#) | Stroke Color #SpiderRed#
Shape10=Line 158,58,150,95 | StrokeWidth (2*#Scale#) | Stroke Color #SpiderRed#
DynamicVariables=1
UpdateDivider=-1