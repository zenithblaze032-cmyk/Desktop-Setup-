[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc
Scale=1.0

; =============================================================
; MEASURES (Native PowerPlugin)
; =============================================================

; Returns numeric percentage (0-100)
[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
MinValue=0
MaxValue=100

; Returns charging status (0=No Bat, 1=Charging, 2=Critical, 3=Low, 4=High/AC)
[MeasureBatteryStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status
Substitute="0":"NO BATTERY","1":"CHARGING","2":"CRITICAL","3":"LOW BATTERY","4":" ON BATTERY"

; =============================================================
; METERS
; =============================================================

[MeterBatteryLabel]
Meter=String
Text="BATTERY"
StringAlign=Center
FontFace=Porter
FontColor=27,46,64,255
FontSize=(8*#Scale#)
X=(55*#Scale#)
Y=(2*#Scale#)
InlineSetting=CharacterSpacing | 3 | 3
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; Background ring
[MeterRingBG]
Meter=Roundline
StartAngle=(Rad(0))
RotationAngle=(Rad(360))
LineStart=(30*#Scale#)
LineLength=(44*#Scale#)
LineColor=27,46,64,80
Solid=1
AntiAlias=1
X=(0*#Scale#)
Y=(14*#Scale#)
W=(110*#Scale#)
H=(110*#Scale#)
DynamicVariables=1
UpdateDivider=-1

; Active arc
[MeterRingActive]
Meter=Roundline
MeasureName=MeasureBattery
StartAngle=(Rad(-90))
RotationAngle=(Rad(360))
LineStart=(30*#Scale#)
LineLength=(44*#Scale#)
LineColor=27,46,64,255
Solid=1
AntiAlias=1
X=(0*#Scale#)
Y=(14*#Scale#)
W=(110*#Scale#)
H=(110*#Scale#)
DynamicVariables=1

; White inner circle
[MeterRingHole]
Meter=Shape
Shape=Ellipse (55*#Scale#),(69*#Scale#),(28*#Scale#),(28*#Scale#) | Fill Color 173,177,186,255 | StrokeWidth 0
X=0
Y=0
DynamicVariables=1
UpdateDivider=-1

; Ghost Kanji
[MeterBatteryGhost]
Meter=String
Text="🕸"
StringAlign=Center
FontFace=Segoe UI Emoji
FontColor=27,46,64,80
FontSize=(32*#Scale#)
X=(55*#Scale#)
Y=(47*#Scale#)
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; Battery percentage
[MeterBatteryValue]
Meter=String
MeasureName=MeasureBattery
StringAlign=Center
FontFace=Gobold Bold
FontColor=136,39,56,255
FontSize=(18*#Scale#)
X=(55*#Scale#)
Y=(57*#Scale#)
Text="%1%"
InlineSetting=GradientColor | 90 | 200,50,70,255 ; 0.0 | 136,39,56,255 ; 1.0
InlineSetting2=Shadow | 0 | 0 | 10 | 136,39,56,150
AntiAlias=1
DynamicVariables=1

; Charging status
[MeterBatteryStatus]
Meter=String
MeasureName=MeasureBatteryStatus
StringAlign=Center
FontFace=Porter
FontColor=27,46,64,255
FontSize=(8*#Scale#)
X=(55*#Scale#)
Y=(126*#Scale#)
InlineSetting=CharacterSpacing | 2 | 2
AntiAlias=1
DynamicVariables=1

; Bottom rule
[MeterBatteryBottomRule]
Meter=Shape
Shape=Rectangle 0,0,(118*#Scale#),(1*#Scale#) | Fill LinearGradient MyGradient | StrokeWidth 0
MyGradient=0 | 50,75,100,255 ; 0.0 | 27,46,64,255 ; 1.0
X=0
Y=(140*#Scale#)
UpdateDivider=-1
DynamicVariables=1
