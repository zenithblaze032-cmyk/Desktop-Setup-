; =============================================================
; BATTERY.ini — v1 "SPIDER-VERSE"
; Power ring with Spider-Red active arc + ghost geometric web
; =============================================================

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.ini
Scale=1.0

; =============================================================
; MEASURES (Native PowerPlugin)
; =============================================================

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
MinValue=0
MaxValue=100

[MeasureBatteryStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status
Substitute="0":"NO BATTERY","1":"CHARGING","2":"CRITICAL","3":"LOW","4":"ON BATTERY"

; =============================================================
; METERS
; =============================================================

[MeterBatteryLabel]
Meter=String
Text="SPIDER POWER"
StringAlign=Center
FontFace=Porter
FontColor=#Color3#
FontSize=(8*#Scale#)
X=(55*#Scale#)
Y=(2*#Scale#)
InlineSetting=CharacterSpacing | 3 | 3
AntiAlias=1
DynamicVariables=1
UpdateDivider=-1

; Ghost web watermark: concentric rings + radial spokes
[MeterWebGhost]
Meter=Shape
Shape=Ellipse 55,66,40,40 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape2=Ellipse 55,66,30,30 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape3=Ellipse 55,66,20,20 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape4=Ellipse 55,66,12,12 | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape5=Line 30,66,80,66 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape6=Line 55,40,55,92 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape7=Line 30,97.5,80,34.5 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
Shape8=Line 30,34.5,80,97.5 | StrokeWidth (1*#Scale#) | Stroke Color #WebGhost#
X=0
Y=26
DynamicVariables=1
UpdateDivider=-1

; Background ring
[MeterRingBG]
Meter=Roundline
StartAngle=0
RotationAngle=6.283185307179586
LineStart=(30*#Scale#)
LineLength=(44*#Scale#)
LineColor=118,122,140,45
Solid=1
AntiAlias=1
X=(0*#Scale#)
Y=(14*#Scale#)
W=(110*#Scale#)
H=(110*#Scale#)
DynamicVariables=1
UpdateDivider=-1

; Active arc (clockwise)
[MeterRingActive]
Meter=Roundline
MeasureName=MeasureBattery
StartAngle=(-1.57079632679490)
RotationAngle=6.283185307179586
LineStart=(30*#Scale#)
LineLength=(44*#Scale#)
LineColor=#SpiderRed#
Solid=1
AntiAlias=1
X=(0*#Scale#)
Y=(14*#Scale#)
W=(110*#Scale#)
H=(110*#Scale#)
DynamicVariables=1

; Inner white circle mask
[MeterRingHole]
Meter=Shape
Shape=Ellipse 55,69,30,30 | Fill Color 255,255,255,255 | StrokeWidth 0
X=0
Y=0
UpdateDivider=-1
DynamicVariables=1

; Battery percentage
[MeterBatteryValue]
Meter=String
MeasureName=MeasureBattery
StringAlign=Center
FontFace=Gobold Bold
FontColor=#Color1#
FontSize=(16*#Scale#)
X=(55*#Scale#)
Y=(52*#Scale#)
Text="%1%"
AntiAlias=1
DynamicVariables=1

; Charging status
[MeterBatteryStatus]
Meter=String
MeasureName=MeasureBatteryStatus
StringAlign=Center
FontFace=Porter
FontColor=#NavyBlue#
FontSize=(8*#Scale#)
X=(55*#Scale#)
Y=(126*#Scale#)
InlineSetting=CharacterSpacing | 2 | 2
AntiAlias=1
DynamicVariables=1

; Bottom rule
[MeterBatteryBottomRule]
Meter=Shape
Shape=Rectangle 0,0,(118*#Scale#),(1*#Scale#) | Fill Color #LineColor# | StrokeWidth 0
X=0
Y=(140*#Scale#)
UpdateDivider=-1
DynamicVariables=1